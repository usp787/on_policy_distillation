# Phase 2 — on-policy distillation (GKD). Consumed by src/train_gkd.py. See README §10.
#
# Teacher = Qwen3-30B-A3B-Instruct-2507: same Qwen3 family (shared 151,936 vocab -> logit
# KL valid), NON-THINKING (matches our 8192 ruler, no mode mismatch), AIME25 61.3 vs the
# 4B student's 47.4 -> a real +14 gap to teach, and no SFT needed. It's MoE (30.5B total
# but only 3.3B active/token), so the teacher forward pass in GKD is cheap (~3B-dense
# cost). bf16 weights ~61 GB co-resident with the 4B student fit one H200 (141 GB); the
# weights download to $HF_HOME on scratch. (Self-distill from the Phase-1 4B was dropped
# — Phase 1 was a null result, nothing to recover.)

student: Qwen/Qwen3-4B-Instruct-2507             # always a FRESH student
teacher: Qwen/Qwen3-30B-A3B-Instruct-2507        # 30B MoE, non-thinking, AIME25 61.3
train_data: data/train_math.json                  # chat-formatted math prompts

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# trl.experimental.gkd.GKDConfig fields
gkd:
  output_dir: checkpoints/phase2_distill
  lmbda: 1.0                     # 1.0 = 100% student-generated (on-policy)
  beta: 1.0                      # 1.0 = reverse KL (mode-seeking, "unhackable")
  temperature: 1.0
  # On-policy rollouts are distilled at this cap. The first Phase-2 run used 2048, but
  # eval allows 8192 and ~30% of AIME solutions truncate even there -> distilling on
  # truncated rollouts biases the student short and hurts the long/hard problems. 4096
  # roughly halves that bias; HF-generate is slower but we have the budget (see below).
  max_new_tokens: 4096
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  # First run was badly under-trained: 100 steps = 0.2 epoch = ~16 min of an 8h slot,
  # loss still falling at the end. At ~10-15 s/step a 600-step run is ~2-2.5h -> well
  # inside 8h. LR raised from RL-scale 1e-6 to a distillation-scale 5e-6 to actually
  # move the LoRA (watch grad_norm stays bounded, <~10; lower LR if it spikes).
  learning_rate: 5.0e-6
  max_steps: 600
  save_steps: 100
  logging_steps: 1
  bf16: true
  gradient_checkpointing: true
  report_to: []
