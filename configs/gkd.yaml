# Phase 2 — on-policy distillation (GKD). Consumed by src/train_gkd.py. See README §10.
#
# Teacher = Qwen3-30B-A3B-Instruct-2507: same Qwen3 family (shared 151,936 vocab -> logit
# KL valid), NON-THINKING (matches our 8192 ruler, no mode mismatch), AIME25 61.3 vs the
# 4B student's 47.4 -> a real +14 gap to teach, and no SFT needed. It's MoE (30.5B total
# but only 3.3B active/token), so the teacher forward pass in GKD is cheap (~3B-dense
# cost). bf16 weights ~61 GB co-resident with the 4B student fit one H200 (141 GB); the
# weights download to $HF_HOME on scratch. (Self-distill from the Phase-1 4B was dropped
# — Phase 1 was a null result, nothing to recover.)

student: Qwen/Qwen3-4B-Instruct-2507             # always a FRESH student
# FP8 (block-128) build of the 30B-A3B-Instruct-2507 teacher: AIME25 61.3 — IDENTICAL to
# the bf16 weights, so the +14 gap over the 4B is fully intact — but ~31 GB resident
# instead of ~61 GB. That freed ~30 GB is exactly the headroom the dense full-vocab KL
# tensor needs: the bf16 teacher left no room and the loss OOM'd (job at step 138). Native
# fp8 loads on the H200 (Hopper); train_gkd.py must load it with dtype="auto" (NOT forced
# bf16) so transformers honors the fp8 quantization_config. No smaller non-thinking Qwen3
# has a real gap (the 2507 instruct line is only 4B/30B/235B), so FP8 of THIS teacher is
# the way to fit one H200 without losing the gap that makes the OPD effect visible.
teacher: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8    # 30B MoE, non-thinking, AIME25 61.3, ~31 GB
train_data: data/train_math.json                  # chat-formatted math prompts

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# trl.experimental.gkd.GKDConfig fields
gkd:
  output_dir: checkpoints/phase2_distill
  lmbda: 1.0                     # 1.0 = 100% student-generated (on-policy)
  beta: 1.0                      # 1.0 = reverse KL (mode-seeking, "unhackable")
  temperature: 1.0
  # On-policy rollouts are distilled at this cap. TRL GKD samples with HF `generate`
  # (no vLLM, README Appx B), which is O(tokens) sequential decode AND runs to the cap
  # whenever the student doesn't emit EOS. The 4096 run blew up: per-step time was 40-80x
  # the estimate (10-30 min/step) because long rollouts dominate -> only 59/600 steps in
  # 8h, killed by the wall (job 7497131). Back to 2048: halves worst-case decode and is
  # the exact memory/speed profile of the first run, which fit batch-8 with no OOM.
  # Trade-off (accepted): 2048 < the 8192 eval ruler, so we distill on more-truncated
  # rollouts and re-introduce a short-bias on long/hard problems (README ~30% truncate at
  # 8192). That bias is the unavoidable cost of staying on HF-generate; the vLLM path
  # (src/handrolled_opd.py) is the way out if 2048 transfer proves too weak.
  max_new_tokens: 2048
  # KL loss memory is batch x seq x vocab (151,936) in fp32, and it scales with the ACTUAL
  # rollout length (grows as training proceeds). Batch-8 OOM'd at step 138 once rollouts got
  # long (9.27 GB KL tensor, no room beside the teacher). Halve it: batch 4 + accum 2 keeps
  # the effective batch at 8 but ~halves the live KL tensor (~4.6 GB). Combined with the FP8
  # teacher (~30 GB freed) this fits with real margin; decode throughput stays fine (the
  # 2048 cap already brought steps to ~12-45 s — speed is no longer the binding constraint).
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  # LR stays at the distillation-scale 5e-6 to actually move the LoRA (1e-6 was RL-scale and
  # under-moved). Watch: a high LR can lengthen/destabilize rollouts (-> slower steps); if
  # grad_norm spikes >~10 or step time creeps up, drop to 3e-6.
  learning_rate: 5.0e-6
  # max_steps cut 600 -> 300. 600 never had a prayer of fitting a generate-bound 8h slot;
  # 300 x effective-batch-8 = 2400 seqs ~= 0.6 epoch of the ~4k-prompt set (vs the first
  # run's under-trained 0.2). With save_steps=25 + auto-resume (train_gkd.py), a timed-out
  # job is no longer wasted: resubmit the sbatch and it continues from the last checkpoint.
  max_steps: 300
  save_steps: 25
  save_total_limit: 2          # keep only the 2 newest checkpoints (resume needs just the last) -> bounded disk
  logging_steps: 1
  bf16: true
  gradient_checkpointing: true
  report_to: []
